<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catálogo de comprobación</title><style>
:root{font:16px system-ui,Arial;color:#202020;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}header{background:#151515;color:#f5d079;padding:24px max(20px,calc((100vw - 1080px)/2));font-weight:800;letter-spacing:.03em}small{color:#bdbdbd;display:block;font-size:12px;font-weight:400;margin-top:4px}main{max-width:1080px;margin:auto;padding:28px 20px}h1{margin:0 0 6px}p{color:#5b5b5b}a{color:#846311}a:hover{text-decoration:none}.cols{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}.card{border:1px solid #e4dfd3;background:white;border-radius:12px;padding:20px;box-shadow:0 4px 15px #0000000b}label{display:block;margin-top:13px;font-weight:600}input,textarea,select{display:block;width:100%;border:1px solid #c9c6bd;border-radius:7px;padding:9px;font:inherit;margin-top:5px}textarea{min-height:80px}button{margin-top:14px;background:#1e1e1e;border:0;border-radius:7px;padding:10px 13px;color:white;cursor:pointer;font-weight:700}button:hover{background:#715b23}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.badge{background:#e5f5e5;color:#176520;border-radius:30px;padding:4px 8px;font-size:12px}.badge.off{background:#fff0ef;color:#98352b}.hint{font-size:12px}.notice{padding:11px;background:#fff6df;color:#4b3a1c;margin-top:12px;border-radius:7px}strong{font-weight:750}@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style></head><body><header>IMPORTACIONES EUROAMERICANAS<small>CATÁLOGO DE COMPROBACIÓN DE DISPONIBILIDAD</small></header><main><h1>Productos disponibles</h1><p>Esta vista de prueba usa backend/productos.json. No sustituye el frontend React ni la HU-02.</p><a href="/admin/disponibilidad">← Volver al panel</a><div id="items" class="card" style="margin-top:18px"></div></main><script>async function cargar(){let d=document.getElementById('items');try{const r=await fetch('/api/hu07/catalogo');const x=await r.json();if(!r.ok)throw Error(JSON.stringify(x));d.replaceChildren();for(const p of x){let z=document.createElement('p');z.textContent=`${p.nombre} — ${Number(p.precio).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0})}`;d.append(z)}if(!x.length)d.textContent='No hay productos disponibles'}catch(e){d.textContent=e.message}}cargar();</script></body></html>
